name: 💡 Feature request
description: Suggest an idea or improvement for Escape-Route
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the gap or friction you are hitting.
      placeholder: I want to export my itinerary as a PDF so I can share it offline.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Itinerary generation (AI / Gemini)
        - Interactive map & routing
        - Planner form
        - Saved escapes
        - Sharing / social preview
        - Developer experience
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
